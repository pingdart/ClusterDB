[package]
name = "pingdart-core"
version = "0.1.0"
edition = "2024"
default-run = "pingdart-core"

[lib]
name = "pingdart_core"
path = "src/lib.rs"

[[bin]]
name = "pingdart-core"
path = "src/main.rs"

[[bin]]
name = "pingdart-mcp"
path = "src/bin/mcp_server.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[[bin]]
name = "pingdart"
path = "src/bin/pingdart.rs"

[[bin]]
name = "pingdart-benchmark"
path = "src/bin/benchmark.rs"

[dependencies]
toml = "0.8"
sled = "0.34.7"
tokio = { version = "1.37.0", features = ["full"] }
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
sqlparser = "0.45.0"
axum = { version = "0.7.5", features = ["ws", "multipart"] }
futures-util = "0.3"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.8.0", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
rustyline = "14.0"
serde_json = "1.0"
chrono = "0.4.45"
geohash = "0.13.2"
sha2 = "0.10"
rand = "0.8"
aes-gcm = "0.10"
hex = "0.4"
prost = "0.13"
zstd = "0.13"
