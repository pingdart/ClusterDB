[package]
name = "pingdart-core"
version = "0.1.0"
edition = "2024"
default-run = "pingdart-core"

[dependencies]
sled = "0.34.7"
tokio = { version = "1.37.0", features = ["full"] }
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
sqlparser = "0.45.0"
axum = "0.7.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.8.0", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
rustyline = "14.0"
serde_json = "1.0"
chrono = "0.4.45"
geohash = "0.13.2"
sha2 = "0.10"
