apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pingdartclusters.db.pingdart.io
spec:
  group: db.pingdart.io
  names:
    kind: PingDartCluster
    listKind: PingDartClusterList
    plural: pingdartclusters
    singular: pingdartcluster
    shortNames:
    - pdc
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - replicas
            properties:
              replicas:
                type: integer
                minimum: 1
                default: 3
              image:
                type: string
                default: "pingdart/pingdart-core:latest"
              storage:
                type: object
                properties:
                  size:
                    type: string
                    default: "20Gi"
                  storageClassName:
                    type: string
              resources:
                type: object
                properties:
                  limits:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                  requests:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
              objectStore:
                type: object
                properties:
                  endpoint:
                    type: string
                  bucket:
                    type: string
                  secretRef:
                    type: string
          status:
            type: object
            properties:
              readyReplicas:
                type: integer
              leader:
                type: string
              phase:
                type: string
    subresources:
      status: {}
