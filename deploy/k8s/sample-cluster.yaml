apiVersion: db.pingdart.io/v1alpha1
kind: PingDartCluster
metadata:
  name: pingdart-production
  namespace: default
spec:
  replicas: 3
  image: "pingdart/pingdart-core:v0.4.0"
  storage:
    size: "50Gi"
    storageClassName: "standard"
  resources:
    limits:
      cpu: "4000m"
      memory: "8Gi"
    requests:
      cpu: "1000m"
      memory: "2Gi"
  objectStore:
    endpoint: "http://minio.storage.svc:9000"
    bucket: "pingdart-backups"
    secretRef: "minio-credentials"
