apiVersion: v1
kind: Namespace
metadata:
  name: pingdart-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pingdart-operator
  namespace: pingdart-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pingdart-operator-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["statefulsets", "deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["db.pingdart.io"]
  resources: ["pingdartclusters", "pingdartclusters/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pingdart-operator-rolebinding
subjects:
- kind: ServiceAccount
  name: pingdart-operator
  namespace: pingdart-system
roleRef:
  kind: ClusterRole
  name: pingdart-operator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingdart-operator
  namespace: pingdart-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pingdart-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pingdart-operator
    spec:
      serviceAccountName: pingdart-operator
      containers:
      - name: manager
        image: pingdart/operator:v0.1.0
        command:
        - /manager
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
