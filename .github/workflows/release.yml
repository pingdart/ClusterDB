name: PingDartDB Release Build Matrix

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            arch: aarch64
            use_cross: true

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Run Unit & Integration Tests (x86_64)
        if: matrix.arch == 'x86_64'
        run: cargo test --all-targets

      - name: Compile Release Binaries
        if: matrix.arch == 'x86_64'
        run: |
          cargo build --release --bin pingdart-core --bin pingdart
          ./packaging/build_release_bundle.sh

      - name: Compile Release Binaries with Cross (ARM64)
        if: matrix.arch == 'aarch64'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          cross build --release --target aarch64-unknown-linux-gnu --bin pingdart-core --bin pingdart
          mkdir -p target/release
          cp target/aarch64-unknown-linux-gnu/release/pingdart-core target/release/
          cp target/aarch64-unknown-linux-gnu/release/pingdart target/release/
          ./packaging/build_release_bundle.sh

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
